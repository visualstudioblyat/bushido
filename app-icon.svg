<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#11102a"/>
    </linearGradient>
    <radialGradient id="planet" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </radialGradient>
    <clipPath id="rc"><rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/></clipPath>
  </defs>
  <g clip-path="url(#rc)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="300" cy="260" r="260" fill="#6366f1" opacity="0.18"/>
    <!-- stars -->
    <circle cx="778" cy="246" r="7" fill="#e2e8f0" opacity="0.9"/>
    <circle cx="840" cy="410" r="4" fill="#e2e8f0" opacity="0.8"/>
    <circle cx="205" cy="758" r="5" fill="#e2e8f0" opacity="0.85"/>
    <!-- orbit (behind) + planet + orbit (front) -->
    <g transform="rotate(-28 512 512)">
      <ellipse cx="512" cy="512" rx="410" ry="205" fill="none" stroke="#a5b4fc" stroke-width="20"/>
    </g>
    <circle cx="512" cy="512" r="200" fill="url(#planet)"/>
    <ellipse cx="430" cy="430" rx="70" ry="55" fill="#c7d2fe" opacity="0.35"/>
    <g transform="rotate(-28 512 512)">
      <path d="M 102 512 A 410 205 0 0 0 922 512" fill="none" stroke="#c7d2fe" stroke-width="20"/>
    </g>
    <!-- moon -->
    <circle cx="150" cy="648" r="46" fill="#e2e8f0"/>
  </g>
</svg>
